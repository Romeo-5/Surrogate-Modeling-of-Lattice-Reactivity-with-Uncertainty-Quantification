name: lattice-uq
channels:
  - conda-forge
dependencies:
  - python=3.11
  # Transport
  - openmc=0.15.*
  # Campaign + analysis
  - numpy>=1.24
  - scipy>=1.11          # scipy.stats.qmc for LHS / Sobol designs
  - pandas>=2.0
  - pyarrow>=14          # parquet results store
  - h5py>=3.9
  - scikit-learn>=1.4    # GaussianProcessRegressor, MLPRegressor
  - matplotlib>=3.8
  - tqdm
  - pytest
  - pyyaml
